name: Release TapCanvas

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: TapCanvas-linux-x64.AppImage
            target: --linux
          - os: windows-latest
            artifact_name: TapCanvas-win-x64.exe
            target: --win
          - os: macos-latest
            artifact_name: TapCanvas-mac-x64.dmg
            target: --mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build ${{ matrix.target }}

      - name: Rename artifact
        run: |
          cd release
          for f in *; do
            mv "$f" "${matrix.artifact_name}"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          gh release create "$tag" artifacts/* --title "TapCanvas $tag" --notes "TapCanvas Acoustic Interface $tag" --draft=false
